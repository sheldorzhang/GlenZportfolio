<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>MAGIC 嵌入式主动洞察回放</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    html,body{position:fixed;inset:0;margin:0;width:100%;height:100%;overflow:hidden;background:#f5f6f8}
    #stage{position:absolute;inset:0;overflow:hidden;background:#fff}
    #replay{
      position:absolute;left:50%;top:50%;width:1440px;height:900px;overflow:hidden;
      background:#fff;transform:translate(-50%,-50%);transform-origin:center;
    }
    #frame{display:block;width:1440px;height:900px;user-select:none;-webkit-user-drag:none}
    .panel-shine{
      position:absolute;top:265px;width:553.5px;height:104px;overflow:hidden;border-radius:6px;
      pointer-events:none;
    }
    .panel-shine.one{left:241px}
    .panel-shine.two{left:844.5px}
    .panel-shine::after{
      position:absolute;inset:0;background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.68) 50%,transparent 66%);
      content:"";opacity:0;transform:translateX(-120%);animation:panel-shimmer 6.4s ease-in-out infinite;
    }
    .panel-shine.two::after{animation-delay:1.65s}
    .live-dot{
      position:absolute;top:390px;width:6px;height:6px;border-radius:50%;
      background:#524eeb;box-shadow:0 0 0 0 rgba(82,78,235,.28);
      pointer-events:none;animation:dot-breathe 2s ease-in-out infinite;
    }
    .live-dot.one{left:241px}
    .live-dot.two{left:844.5px;animation-delay:.3s}
    #expand{
      position:absolute;right:24px;bottom:22px;top:auto;left:auto;z-index:5;display:grid;place-items:center;
      width:46px;height:46px;padding:0;border:0;border-radius:14px;background:rgba(255,255,255,.92);
      color:#303236;box-shadow:0 4px 16px rgba(29,34,48,.14);cursor:pointer;
      opacity:0;transform:translateY(4px);transition:opacity .2s ease,transform .2s ease,background .2s ease;
    }
    #stage:hover #expand,#expand:focus-visible{opacity:1;transform:none}
    @media(max-width:767px){#expand{right:16px;bottom:16px}}
    #expand:hover{background:#fff}
    #expand:focus-visible{outline:2px solid #5555ec;outline-offset:2px}
    #expand svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    html[data-expanded="true"] #expand{opacity:0;visibility:hidden;pointer-events:none}
    @keyframes panel-shimmer{
      0%,58%{opacity:0;transform:translateX(-120%)}
      62%{opacity:1}
      78%{opacity:1;transform:translateX(120%)}
      79%,100%{opacity:0;transform:translateX(120%)}
    }
    @keyframes dot-breathe{
      0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(82,78,235,.28);transform:scale(1)}
      50%{opacity:.65;box-shadow:0 0 0 5px rgba(82,78,235,0);transform:scale(.9)}
    }
    @media(prefers-reduced-motion:reduce){
      .panel-shine::after,.live-dot{animation:none}
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="replay" role="img" aria-label="MAGIC 首页主动洞察自动回放：运营洞察更新后，给出可继续执行的人群和预警">
      <img id="frame" src="frame.png" width="1440" height="900" alt="">
      <span class="panel-shine one"></span>
      <span class="panel-shine two"></span>
      <span class="live-dot one"></span>
      <span class="live-dot two"></span>
    </div>
    <button id="expand" type="button" aria-label="放大回放窗口" title="放大回放窗口">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
    </button>
  </div>
  <script>
    (function(){
      var W=1440,H=900,replay=document.getElementById('replay'),expand=document.getElementById('expand');
      var parentTarget='*';
      function fit(){
        var w=document.documentElement.clientWidth||innerWidth;
        var h=document.documentElement.clientHeight||innerHeight;
        var inset=w<520?12:0;
        var scale=Math.min((w-inset*2)/W,(h-inset*2)/H);
        replay.style.transform='translate(-50%,-50%) scale('+scale+')';
      }
      addEventListener('resize',fit);
      if(window.visualViewport)visualViewport.addEventListener('resize',fit);
      expand.addEventListener('click',function(){
        if(parent!==window)parent.postMessage({type:'magic-replay:toggle-expand'},parentTarget);
      });
      addEventListener('message',function(event){
        if(event.source!==parent||!event.data)return;
        if(event.data.type==='magic-replay:expanded')document.documentElement.dataset.expanded=String(Boolean(event.data.value));
      });
      fit();
      if(parent!==window){
        parent.postMessage({type:'magic-demo:ready',demo:'case3',phase:'looping'},parentTarget);
        parent.postMessage({type:'magic-replay:ready'},parentTarget);
      }
    })();
  </script>
</body>
</html>
