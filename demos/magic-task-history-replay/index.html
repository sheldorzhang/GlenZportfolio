<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <link rel="icon" href="data:,">
  <title>MAGIC Multi-Agent 活动策划回放</title>
  <style>
    html,body{position:fixed;inset:0;margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    #stage{position:absolute;inset:0;overflow:hidden;background:#fff}
    #product{
      position:absolute;left:50%;top:50%;width:1440px;height:900px;border:0;background:#fff;
      opacity:0;transform-origin:center;transition:opacity .42s ease;
    }
    #nav-guard{position:absolute;z-index:1;background:transparent;pointer-events:auto}
    html[data-interactive="true"] #nav-guard{pointer-events:none}
    html[data-product-ready="true"] #product{opacity:1}
    #status{
      position:absolute;inset:0;z-index:2;display:grid;place-content:center;gap:14px;
      padding:24px;text-align:center;background:linear-gradient(145deg,#f8f9fc,#eef1f7);
      color:#747982;font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
      transition:opacity .28s ease,visibility .28s ease;
    }
    html[data-ready="true"] #status{opacity:0;visibility:hidden;pointer-events:none}
    .spinner{width:26px;height:26px;margin:auto;border:2px solid rgba(82,78,235,.16);border-top-color:#524eeb;border-radius:50%;animation:spin .8s linear infinite}
    #status p{margin:0}
    #retry{display:none;justify-self:center;min-height:38px;padding:0 17px;border:0;border-radius:999px;background:#17181a;color:#fff;font:600 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;cursor:pointer}
    html[data-error="true"] .spinner{display:none}
    html[data-error="true"] #retry{display:block}
    #playbar{position:absolute;z-index:4;left:0;right:0;bottom:var(--playbar-bottom,24px);display:flex;justify-content:center;padding:4px 0 8px;pointer-events:none;transform:scale(var(--stage-scale,1));transform-origin:center bottom}
    #playbar[hidden]{display:none}
    .drb{position:relative;width:588px;max-width:calc(100% - 24px);height:72px;pointer-events:auto}
    .drb--playback{width:520px}
    .drb__pill{position:absolute;inset:0;height:72px;box-sizing:border-box;display:flex;align-items:center;overflow:hidden;border:1px solid rgba(0,0,0,.08);border-radius:100px;box-shadow:0 4px 8px -6px #424d503d,0 12px 24px -16px #424d5029}
    .drb__pill--done{padding:16px 16px 16px 100px;justify-content:space-between;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .drb__pill--running{padding:12px 24px 12px 80px;background-image:linear-gradient(167.456deg,#d2ceff33 4.3584%,#d2ceff00 37.549%),linear-gradient(90deg,#fff9 0% 100%);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .drb__text{font-family:PingFang SC,-apple-system,sans-serif;font-weight:600;font-size:16px;line-height:24px;color:#000000e6;white-space:nowrap}
    .drb__btn-dark{position:absolute;right:24px;top:14px;height:44px;padding:0 24px 2px;display:flex;align-items:center;justify-content:center;background:#101010;border:0;border-radius:100px;cursor:pointer;font-family:PingFang SC,-apple-system,sans-serif;font-weight:700;font-size:14px;line-height:26px;color:#fff;white-space:nowrap}
    .drb__btn-outline{height:40px;min-width:88px;padding:0 20px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:4px;overflow:hidden;background:linear-gradient(to bottom,#fafbfc,#f2f4f7);border:1px solid #e9ebf0;border-radius:100px;box-shadow:0 2px 4px -2px #0000001f;cursor:pointer;font-family:PingFang SC,-apple-system,sans-serif;font-weight:700;font-size:14px;line-height:26px;color:#000;white-space:nowrap}
    .drb__ip{position:absolute;top:5px;width:62px;height:62px;pointer-events:none}
    .drb__ip--success{left:16px;overflow:hidden}
    .drb__ip--working{left:10px;overflow:hidden}
    .drb__ip img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
    .drb--playback.is-paused .drb__ip--working{display:grid;place-items:center;border-radius:50%;background:#eeecff}
    .drb--playback.is-paused .drb__ip--working:after{content:"Ⅱ";color:#5555ec;font:700 18px/1 -apple-system,PingFang SC,sans-serif;letter-spacing:2px}
    .drb--playback.is-paused .drb__ip--working img{display:none}
    html[data-state="running"] .drb__pill--running,html[data-state="paused"] .drb__pill--running{width:100%}
    html[data-state="running"] #playbar,html[data-state="paused"] #playbar{bottom:var(--playbar-playback-bottom,24px)}
    @media(max-width:767px){.drb{max-width:calc(100% - 24px)}.drb__pill--done{padding-left:76px}.drb__ip--success{left:8px}}
    #expand{
      position:absolute;right:24px;bottom:22px;top:auto;left:auto;z-index:3;display:grid;place-items:center;
      width:46px;height:46px;padding:0;border:0;border-radius:14px;background:rgba(255,255,255,.9);
      color:#303236;box-shadow:0 4px 16px rgba(29,34,48,.14);cursor:pointer;
      opacity:0;visibility:hidden;transform:translateY(4px);
      transition:opacity .2s ease,transform .2s ease,background .2s ease;
    }
    @media(max-width:767px){#expand{right:16px;bottom:16px}}
    #expand:hover{background:#fff}
    #expand:focus-visible{outline:2px solid #5555ec;outline-offset:2px}
    #expand svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    #expand .icon-collapse{display:none}
    html[data-ready="true"] #expand{opacity:1;visibility:visible;transform:none}
    html[data-expanded="true"] #expand{opacity:0;visibility:hidden;pointer-events:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){#product,#status,#expand{transition:none}.spinner{animation:none}}
  </style>
</head>
<body>
  <div id="stage">
    <iframe id="product" title="MAGIC Agent Multi-Agent 活动策划交互回放" allow="autoplay; fullscreen"></iframe>
    <div id="nav-guard" aria-hidden="true"></div>
    <button id="expand" type="button" aria-label="放大回放窗口" title="放大回放窗口">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
    </button>
    <div id="status" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <p id="status-text">正在进入 MAGIC 活动策划演示…</p>
      <button id="retry" type="button">重新加载</button>
    </div>
    <div id="playbar" class="demo-run-bar" aria-live="polite">
      <div id="playbar-ready" class="drb drb--done">
        <div class="drb__pill drb__pill--done">
          <span class="drb__text" id="playbar-text">Multi-Agent 演示已准备</span>
          <button class="drb__btn-outline" id="playbar-action" type="button">开始体验</button>
        </div>
        <div class="drb__ip drb__ip--success"><img src="../../ui/agent/static/ip-success-CYgbYHi2.png" alt=""></div>
      </div>
      <div id="playbar-progress" class="drb drb--playback" hidden>
        <div class="drb__pill drb__pill--running"><span class="drb__text" id="playbar-progress-text">Multi-Agent 演示进行中</span></div>
        <button class="drb__btn-dark" id="playbar-progress-action" type="button">暂停</button>
        <div class="drb__ip drb__ip--working"><img src="../../ui/agent/static/workbench-ip-transparent-W5OFQJ30.webp" alt=""></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var PRODUCT_URL = '../../ui/agent/index.html';
      var W = 1440;
      var H = 900;
      var frame = document.getElementById('product');
      var navGuard = document.getElementById('nav-guard');
      var statusText = document.getElementById('status-text');
      var retry = document.getElementById('retry');
      var expand = document.getElementById('expand');
      var playbar = document.getElementById('playbar');
      var playbarText = document.getElementById('playbar-text');
      var playbarAction = document.getElementById('playbar-action');
      var progressBar = document.getElementById('playbar-progress');
      var progressText = document.getElementById('playbar-progress-text');
      var progressAction = document.getElementById('playbar-progress-action');
      var timer = 0;
      var readyPoll = 0;
      var parentTarget = '*';
      var state = 'ready';
      var warming = false;
      var seededDefault = false;

      function setState(next) {
        state = next;
        document.documentElement.dataset.state = next;
        if (next === 'running' || next === 'paused') document.documentElement.dataset.started = 'true';
        document.documentElement.dataset.interactive = next === 'ready' && document.documentElement.dataset.started === 'true' ? 'true' : 'false';
        var isProgress = next === 'running' || next === 'paused';
        document.getElementById('playbar-ready').hidden = isProgress;
        progressBar.hidden = !isProgress;
        if (next === 'ready') {
          playbarText.textContent = 'Multi-Agent 演示已准备';
          playbarAction.textContent = '开始体验';
          playbar.hidden = false;
        } else if (next === 'running') {
          progressText.textContent = 'Multi-Agent 演示进行中';
          progressAction.textContent = '暂停';
          playbar.hidden = false;
        } else if (next === 'paused') {
          progressText.textContent = 'Multi-Agent 演示已暂停';
          progressAction.textContent = '继续';
          playbar.hidden = false;
        } else {
          playbar.hidden = true;
        }
      }

      function fit() {
        var w = document.documentElement.clientWidth || innerWidth;
        var h = document.documentElement.clientHeight || innerHeight;
        var inset = w < 520 ? 12 : 0;
        var scale = Math.min((w - inset * 2) / W, (h - inset * 2) / H);
        var compact = w < 767;
        document.documentElement.style.setProperty('--stage-scale', String(scale));
        document.documentElement.style.setProperty('--playbar-bottom', ((compact ? 14 : 24) * scale) + 'px');
        document.documentElement.style.setProperty('--playbar-playback-bottom', ((compact ? 14 : 24) * scale) + 'px');
        frame.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
        navGuard.style.left = ((w - W * scale) / 2) + 'px';
        navGuard.style.top = ((h - H * scale) / 2) + 'px';
        navGuard.style.width = (210 * scale) + 'px';
        navGuard.style.height = (H * scale) + 'px';
      }

      function hideProductRunBar() {
        try {
          var productDoc = frame.contentDocument;
          if (!productDoc || !productDoc.head || productDoc.getElementById('multi-agent-run-bar-override')) return;
          var style = productDoc.createElement('style');
          style.id = 'multi-agent-run-bar-override';
          style.textContent = '.demo-run-bar{display:none!important}.demo-chatinput-wrap{display:flex!important}';
          productDoc.head.appendChild(style);
        } catch (error) {}
      }

      function productTaskIsComplete() {
        try {
          var productDoc = frame.contentDocument;
          return Boolean(productDoc && productDoc.querySelector('.intent-segment-card.demo-top-intent.is-completed'));
        } catch (error) { return false; }
      }

      function showCompletedProduct() {
        clearTimeout(timer);
        clearInterval(readyPoll);
        warming = false;
        seededDefault = true;
        document.documentElement.dataset.started = 'true';
        document.documentElement.dataset.error = 'false';
        document.documentElement.dataset.ready = 'true';
        document.documentElement.dataset.productReady = 'true';
        document.documentElement.dataset.replayState = 'done';
        setState('ready');
        if (parent !== window) parent.postMessage({ type: 'magic-replay:ready' }, parentTarget);
      }

      function load(options) {
        warming = Boolean(options && options.warmup);
        seededDefault = Boolean(options && options.seedComplete);
        clearTimeout(timer);
        clearInterval(readyPoll);
        document.documentElement.dataset.ready = 'false';
        document.documentElement.dataset.started = seededDefault || warming ? 'false' : 'true';
        document.documentElement.dataset.productReady = 'false';
        document.documentElement.dataset.error = 'false';
        statusText.textContent = seededDefault ? '正在加载已完成的演示…' : '正在进入 MAGIC 活动策划演示…';
        var url = new URL(PRODUCT_URL, location.href);
        url.searchParams.set('route', 'task');
        url.searchParams.set('demo', 'case2');
        url.searchParams.set('theme', 'light');
        url.searchParams.set('fresh', String(Date.now()));
        if (seededDefault) {
          url.searchParams.set('seedCase3', '1');
          url.searchParams.delete('warmup');
        } else if (warming) url.searchParams.set('warmup', '1');
        else {
          url.searchParams.delete('warmup');
          url.searchParams.delete('seedCase3');
        }
        frame.src = url.href;
        if (seededDefault) {
          readyPoll = setInterval(function () {
            if (productTaskIsComplete()) showCompletedProduct();
          }, 250);
        }
        timer = setTimeout(function () {
          document.documentElement.dataset.error = 'true';
          statusText.textContent = '回放资源加载失败，请刷新页面重试。';
        }, 30000);
      }

      addEventListener('resize', fit);
      frame.addEventListener('load', hideProductRunBar);
      if (window.visualViewport) visualViewport.addEventListener('resize', fit);
      addEventListener('message', function (event) {
        if (event.source !== frame.contentWindow || !event.data) return;
        if (event.data.type !== 'magic-demo:ready' && event.data.type !== 'magic-demo:state') return;
        if (warming && event.data.phase !== 'done') return;
        if (warming && event.data.phase === 'done') {
          showCompletedProduct();
          return;
        }
        if (seededDefault) {
          if (event.data.phase === 'done') showCompletedProduct();
          return;
        }
        if (event.data.phase === 'done') {
          setState('loading');
          statusText.textContent = '正在返回已完成的演示…';
          load({ seedComplete: true });
          return;
        }
        clearTimeout(timer);
        document.documentElement.dataset.error = 'false';
        document.documentElement.dataset.ready = 'true';
        document.documentElement.dataset.productReady = 'true';
        document.documentElement.dataset.replayState = event.data.phase || 'running';
        if (event.data.phase === 'done') setState('ready');
        else if (event.data.phase === 'paused') setState('paused');
        else setState('running');
        if (parent !== window) parent.postMessage({ type: 'magic-replay:ready' }, parentTarget);
      });
      retry.addEventListener('click', function () {
        load(seededDefault ? { seedComplete: true } : null);
      });
      playbarAction.addEventListener('click', function () {
        if (state === 'ready') {
          setState('loading');
          statusText.textContent = '正在进入 MAGIC 活动策划演示…';
          document.documentElement.dataset.ready = 'false';
          load();
        } else if (state === 'running') {
          frame.contentWindow.postMessage({ type: 'magic-task-playback', action: 'pause' }, '*');
          setState('paused');
        } else if (state === 'paused') {
          frame.contentWindow.postMessage({ type: 'magic-task-playback', action: 'resume' }, '*');
          setState('running');
        }
      });
      expand.addEventListener('click', function () {
        if (parent !== window) {
          parent.postMessage({ type: 'magic-replay:toggle-expand' }, parentTarget);
        }
      });
      addEventListener('message', function (event) {
        if (event.source !== parent || !event.data) return;
        if (event.data.type !== 'magic-replay:expanded') return;
        document.documentElement.dataset.expanded = String(Boolean(event.data.value));
      });
      progressAction.addEventListener('click', function () {
        if (state === 'running') {
          frame.contentWindow.postMessage({ type: 'magic-task-playback', action: 'pause' }, '*');
          setState('paused');
        } else if (state === 'paused') {
          frame.contentWindow.postMessage({ type: 'magic-task-playback', action: 'resume' }, '*');
          setState('running');
        }
      });
      fit();
      document.documentElement.dataset.ready = 'true';
      setState('ready');
      if (parent !== window) parent.postMessage({ type: 'magic-replay:ready' }, parentTarget);
      // Seed a completed mock task directly, without replaying its steps on entry.
      load({ seedComplete: true });
    })();
  </script>
</body>
</html>
