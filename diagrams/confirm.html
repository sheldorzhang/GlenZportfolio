<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>示意图 · 过程可介入</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --fig-w:1440px;
  --fig-h:810px;
  --page:#e8e8e8;
  --fig-bg:#FAFAFA;
  --fig-card:#FFFFFF;
  --fig-ink:#1C1C1C;
  --fig-ink-2:#5C5C5C;
  --fig-line:#E6E6E6;
  --fig-accent:#5555EC;
  --fig-font:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  --fig-side:72px;
  --fig-radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);overflow:hidden}
body{font-family:var(--fig-font);color:var(--fig-ink)}
.canvas{
  position:absolute;left:0;top:0;
  width:var(--fig-w);height:var(--fig-h);
  padding:48px var(--fig-side);
  background:var(--fig-bg);
  display:flex;align-items:center;
  overflow:hidden;transform-origin:0 0;
}
.board{
  width:100%;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:auto auto auto;
  column-gap:48px;
  row-gap:24px;
  align-items:start;
}
.group{display:contents}
.copy{
  grid-row:1;
  display:flex;flex-direction:column;gap:10px;
}
.copy small{color:var(--fig-accent);font-size:20px;font-weight:600;line-height:1.2}
.copy h2{margin:0;font-size:24px;font-weight:600;line-height:1.35}
.pics{
  grid-row:2;
  align-self:center;
  position:relative;
  width:100%;
  height:550px;
}
.card{
  display:block;
  height:auto;
  background:var(--fig-card);
  border:1px solid var(--fig-line);
  border-radius:var(--fig-radius);
  box-shadow:0 10px 28px rgba(28,28,28,.08);
}
.plan-after{position:absolute;right:0;top:50%;width:75%;transform:translateY(-50%);z-index:2}
.plan-before{position:absolute;left:0;top:50%;width:48%;transform:translateY(-50%);z-index:1}
.options{position:absolute;left:0;top:50%;width:52%;transform:translateY(-50%);z-index:1}
.outcomes{position:absolute;right:0;top:50%;width:72%;transform:translateY(-50%);z-index:2;display:flex;flex-direction:column;gap:16px}
.outcomes .card{width:100%}
.note{
  grid-row:3;
  margin:0;
  padding-top:10px;
  color:var(--fig-ink-2);
  font-size:21px;line-height:1.55;
}
.note::before{
  content:"";
  display:block;
  width:40px;height:3px;
  margin-bottom:16px;
  background:var(--fig-accent);
  border-radius:999px;
}
</style>
</head>
<body>
<main class="canvas" aria-label="计划任务确认卡和通用澄清卡">
  <div class="board">
    <section class="group">
      <header class="copy">
        <small>计划任务确认卡</small>
        <h2>先确认目标与执行计划</h2>
      </header>
      <div class="pics">
        <img class="card plan-before" src="../assets/c1-plan-task-confirm.webp?v=white-4x-20261026" alt="Before：计划任务需求确认简卡，包含场景、人群、目标和执行流程">
        <img class="card plan-after" src="../assets/c1-plan-task-execution.webp?v=white-4x-20261026" alt="After：完整执行计划确认卡，列出规划依据与五个执行步骤">
      </div>
      <p class="note">呈现任务目标、理解依据与执行步骤，让用户确认后再开始执行。</p>
    </section>
    <section class="group">
      <header class="copy">
        <small>通用澄清卡</small>
        <h2>聚焦缺失条件，支持补充后继续</h2>
      </header>
      <div class="pics">
        <div class="outcomes">
          <img class="card" src="../assets/c1-clarification-entry.webp" alt="通用澄清卡：提供候选条件和自由补充入口">
          <img class="card" src="../assets/c1-clarification-confirmed.webp" alt="通用澄清卡：展示已选择条件和确认状态">
        </div>
        <img class="card options" src="../assets/c1-clarification-options.webp" alt="通用澄清卡：列出候选补充条件和其他输入方式">
      </div>
      <p class="note">从候选条件、自由补充到确认结果，在卡片中完成当前澄清。</p>
    </section>
  </div>
</main>
<script src="../assets/diagram-fit.js"></script>
</body>
</html>
