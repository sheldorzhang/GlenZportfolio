<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<title>现状体验地图 · 直角版</title>
<style>
:root{
  --fig-w:1920px;
  --fig-h:1080px;
  --fig-bg:#FAFAFA;
  --fig-card:#FFFFFF;
  --fig-ink:#1C1C1C;
  --fig-ink-2:#5C5C5C;
  --fig-ink-3:#8A8A8A;
  --fig-line:#E6E6E6;
  --fig-font:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  --fig-serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --fig-side:96px;
}
*{box-sizing:border-box}
html,body{margin:0;background:#e8e8e8}
body{min-height:100vh;display:grid;place-items:center;font-family:var(--fig-font);color:var(--fig-ink)}
h2,h3{font-family:var(--fig-serif)}
.canvas{
  width:var(--fig-w);height:var(--fig-h);
  padding:48px var(--fig-side) 44px;
  background:var(--fig-bg);
  display:flex;flex-direction:column;gap:20px;
}
.board{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  grid-template-rows:auto minmax(0,1fr) auto;
  gap:14px 12px;
}
.phase{
  display:flex;flex-direction:column;justify-content:flex-end;gap:8px;
  min-height:72px;padding:0 4px 12px;
  border-bottom:1px solid var(--fig-ink);
}
.phase.span-4{grid-column:span 4}
.phase small{color:var(--fig-ink-3);font-size:16px;font-weight:500;line-height:1}
.phase h2{margin:0;font-size:26px;font-weight:600;line-height:1.3}
.shot{
  background:var(--fig-card);
  border:1px solid var(--fig-ink);
  min-height:0;
  display:flex;flex-direction:column;
  padding:12px 12px 16px;
  gap:12px;
}
.ph{
  flex:1;min-height:180px;
  border:1px dashed var(--fig-ink-3);
  background:#F4F4F4;
  display:flex;align-items:center;justify-content:center;
  color:var(--fig-ink-3);
  font-size:16px;font-weight:500;letter-spacing:.04em;
}
.shot h3{margin:0;font-size:22px;font-weight:600;line-height:1.3;text-align:center}
.shot p{margin:0;color:var(--fig-ink-2);font-size:16px;line-height:1.4;text-align:center}
.loss{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.loss article{
  background:var(--fig-card);
  border:1px solid var(--fig-ink);
  padding:22px 24px;
  display:flex;flex-direction:column;justify-content:center;gap:10px;
}
.loss small{color:var(--fig-ink-3);font-size:15px;font-weight:500;line-height:1}
.loss h3{margin:0;font-size:22px;font-weight:600;line-height:1.35}
.loss p{margin:0;color:var(--fig-ink-2);font-size:16px;line-height:1.5}
</style>
</head>
<body>
<main class="canvas" aria-label="现状体验地图">
  <section class="board">
    <header class="phase span-4">
      <small>编排</small>
      <h2>把业务目标翻译成系统配置</h2>
    </header>
    <header class="phase">
      <small>执行</small>
      <h2>发布与触达</h2>
    </header>
    <header class="phase">
      <small>复盘</small>
      <h2>判断与优化</h2>
    </header>

    <article class="shot">
      <div class="ph">补图</div>
      <h3>人群圈选</h3>
      <p>认人、打标签</p>
    </article>
    <article class="shot">
      <div class="ph">补图</div>
      <h3>活动策划</h3>
      <p>定目标与策略</p>
    </article>
    <article class="shot">
      <div class="ph">补图</div>
      <h3>旅程编排</h3>
      <p>配置触点规则</p>
    </article>
    <article class="shot">
      <div class="ph">补图</div>
      <h3>内容生成</h3>
      <p>准备触达素材</p>
    </article>
    <article class="shot">
      <div class="ph">补图</div>
      <h3>群发触达</h3>
      <p>核对并发送</p>
    </article>
    <article class="shot">
      <div class="ph">补图</div>
      <h3>效果复盘</h3>
      <p>看报表、做判断</p>
    </article>

    <div class="loss">
      <article>
        <small>发现 01</small>
        <h3>目标靠人维持</h3>
        <p>同一个业务目标，要在每个页面里重新翻译一次。</p>
      </article>
      <article>
        <small>发现 02</small>
        <h3>上下文在交接中丢失</h3>
        <p>人群、策略和内容约束过不了下一个页面。</p>
      </article>
      <article>
        <small>发现 03</small>
        <h3>修改没有沉淀</h3>
        <p>确认和修改停在这一场，下一场还要重新解释。</p>
      </article>
    </div>
  </section>
</main>
</body>
</html>
