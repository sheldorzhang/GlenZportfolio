<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1400">
<title>Be4D · 统一设计规范来源 (SSOT)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../assets/be4d-diagrams.css">
</head>
<body>
<main class="canvas ssot-board" aria-label="统一设计规范来源 (SSOT)">
  <header class="ssot-source">
    <h2>统一设计规范来源 (SSOT)</h2>
    <p>设计变量 · 组件用法 · 页面范式</p>
  </header>
  <div class="ssot-links">
    <div class="ssot-link"><span class="ssot-arrow" aria-hidden="true">↓↑</span><p>规范清查与 AI 适配</p></div>
    <div class="ssot-link"><span class="ssot-arrow" aria-hidden="true">↓</span><p>提供设计依据</p></div>
    <div class="ssot-link"><span class="ssot-arrow" aria-hidden="true">↑</span><p>确认后回写更新</p></div>
  </div>
  <div class="ssot-steps">
    <article class="ssot-step"><h3>01 规范整理</h3><p>组件规范与走查 Skills</p></article>
    <span class="ssot-step-arrow" aria-hidden="true">→</span>
    <article class="ssot-step"><h3>02 产品设计</h3><p>需求拆解 Skill + Vibe Coding</p></article>
    <span class="ssot-step-arrow" aria-hidden="true">→</span>
    <article class="ssot-step"><h3>03 走查迭代</h3><p>Figma + Vibe Coding</p></article>
  </div>
  <p class="ssot-note">AI 辅助规范整理与页面生产；设计师负责设计判断、结果走查和规范维护。</p>
</main>
<script src="../assets/diagram-fit.js"></script>
</body>
</html>
